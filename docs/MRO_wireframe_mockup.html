<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MRO 시스템 · UI 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EEF0F4;
  --navy:#0B1220;
  --navy-2:#141D30;
  --sidebar-line:#22304A;
  --accent:#2F6FF0;
  --accent-soft:#E8EFFE;
  --figma-purple:#8B5CF6;
  --surface:#FFFFFF;
  --border:#E3E7EE;
  --text:#101826;
  --text-soft:#5B6472;
  --text-faint:#94A0B2;
  --danger:#E5484D;
  --danger-bg:#FDECEC;
  --warn:#F5A524;
  --warn-bg:#FEF3DE;
  --ok:#12A150;
  --ok-bg:#E7F8EE;
  --radius:10px;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--canvas);font-family:var(--sans);color:var(--text);}

/* ===== TOP CHROME (Figma-style top bar) ===== */
.chrome{
  position:sticky;top:0;z-index:50;
  background:#1B1F27;color:#fff;
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;font-size:13px;
}
.chrome .file-name{font-weight:600;display:flex;align-items:center;gap:8px;}
.chrome .file-name .dot{width:8px;height:8px;border-radius:50%;background:var(--figma-purple);}
.chrome .modeswitch{margin-left:auto;display:flex;background:#2A2F3A;border-radius:8px;padding:3px;gap:2px;}
.chrome .modeswitch button{
  border:none;background:transparent;color:#B7BDC9;padding:6px 14px;border-radius:6px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer;
}
.chrome .modeswitch button.active{background:var(--figma-purple);color:#fff;}
.chrome .hint{color:#8A90A0;font-size:12px;}

/* ===== CANVAS (zoomed-out Figma board) VIEW ===== */
.board{
  padding:56px 48px 120px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(340px,1fr));
  gap:64px 40px;
  max-width:1680px;margin:0 auto;
}
.frame-wrap{position:relative;}
.frame-tag{
  position:absolute;top:-30px;left:0;
  background:var(--figma-purple);color:#fff;font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:6px 6px 0 0;
  font-family:var(--sans);letter-spacing:.2px;
}
.frame-tag small{font-weight:500;opacity:.85;margin-left:6px;}
.frame-thumb{
  background:var(--surface);border:1px solid var(--border);border-radius:4px;
  overflow:hidden;transform-origin:top left;
  box-shadow:0 1px 3px rgba(16,24,38,.06);
  cursor:pointer;transition:box-shadow .15s, transform .15s;
  height:230px; position:relative;
}
.frame-thumb:hover{box-shadow:0 8px 24px rgba(16,24,38,.14);transform:translateY(-2px);}
.frame-thumb iframe-sim{display:block;}
.thumb-scale{
  width:1440px;height:900px;
  transform:scale(0.16);transform-origin:top left;
  pointer-events:none;
}

/* ===== FOCUS (single page) VIEW ===== */
.stage{display:none;padding:40px 0 100px;}
.stage.active{display:flex;justify-content:center;}
.frame-focus-wrap{position:relative;}
.frame-focus-tag{
  position:absolute;top:-32px;left:0;
  background:var(--figma-purple);color:#fff;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:6px 6px 0 0;
}
.frame-focus-tag small{font-weight:500;opacity:.85;margin-left:8px;}
.app{
  width:1440px;min-height:900px;background:var(--surface);
  box-shadow:0 2px 40px rgba(16,24,38,.12);
  display:flex;border:1px solid var(--border);
}
.back-btn{
  position:fixed;top:64px;left:24px;z-index:40;
  background:#1B1F27;color:#fff;border:none;border-radius:8px;
  padding:9px 14px;font-family:var(--sans);font-size:12.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);
}

/* ===== APP SHELL ===== */
.app-sidebar{
  width:224px;background:var(--navy);color:#C9D2E3;flex-shrink:0;
  display:flex;flex-direction:column;
}
.app-sidebar .brand{
  padding:20px 18px;font-weight:800;font-size:15px;color:#fff;
  border-bottom:1px solid var(--sidebar-line);display:flex;align-items:center;gap:8px;
}
.app-sidebar .brand .plane{color:var(--accent);}
.nav-item{padding:12px 18px;font-size:13px;font-weight:600;color:#8B96AC;cursor:pointer;display:flex;align-items:center;gap:8px;}
.nav-item.top{padding-top:16px;}
.nav-group-label{padding:14px 18px 4px;font-size:11px;letter-spacing:.06em;color:#5A6478;font-weight:700;text-transform:uppercase;}
.nav-sub{padding:10px 18px 10px 34px;font-size:13px;color:#AEB8CB;cursor:pointer;border-left:2px solid transparent;}
.nav-sub.selected{color:#fff;font-weight:700;border-left:2px solid var(--accent);background:var(--navy-2);}
.nav-sub:hover{color:#fff;}

.app-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.app-header{
  height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  padding:0 20px;gap:14px;font-size:12.5px;color:var(--text-soft);flex-shrink:0;
}
.app-header .crumb{font-weight:600;color:var(--text);}
.app-header .crumb span{color:var(--text-faint);font-weight:500;}
.app-header .icon-btn{margin-left:auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:14px;}
.app-body{flex:1;padding:20px 24px;overflow:auto;background:#FAFBFC;}

/* ===== SHARED UI ATOMS ===== */
.page-title{font-size:18px;font-weight:800;margin:0 0 4px;}
.page-sub{font-size:12.5px;color:var(--text-soft);margin:0 0 18px;}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.chip-select{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 10px;font-size:12.5px;color:var(--text);font-family:var(--sans);}
.search-box{border:1px solid var(--border);background:#fff;border-radius:7px;padding:7px 12px;font-size:12.5px;min-width:200px;color:var(--text-soft);}
.spacer{flex:1;}
.btn{border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);}
.btn-primary{background:var(--accent);color:#fff;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-danger-outline{background:#fff;border:1px solid var(--danger);color:var(--danger);}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);}
.grid-2{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;
  padding:10px 12px;border-bottom:1px solid var(--border);font-weight:700;cursor:pointer;white-space:nowrap;
}
thead th .arrows{color:#C6CCD7;font-size:9px;margin-left:3px;}
tbody td{padding:10px 12px;border-bottom:1px solid #F0F2F5;color:var(--text);white-space:nowrap;}
tbody tr:hover{background:#F7F9FC;cursor:pointer;}
.mono{font-family:var(--mono);}
.chk{width:14px;height:14px;border:1.5px solid #C6CCD7;border-radius:4px;display:inline-block;}
.chk.on{background:var(--accent);border-color:var(--accent);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-warn{background:var(--warn-bg);color:#B4790D;}
.badge-ok{background:var(--ok-bg);color:var(--ok);}
.row-danger{background:#FEF6F6;}
.row-warn{background:#FFFBF2;}

.statusbar{height:6px;border-radius:4px;background:#EEF0F4;overflow:hidden;width:100%;}
.statusbar > div{height:100%;}

/* gauge (signature avionics element) */
.gauge-wrap{display:flex;flex-direction:column;gap:4px;}
.gauge-track{position:relative;height:10px;border-radius:6px;background:#1B2333;overflow:hidden;}
.gauge-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#2F6FF0,#5B9CFF);}
.gauge-ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-faint);}

.panel-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);
  padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.panel-body{padding:14px 16px;}

.kpi-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff;}
.kpi-num{font-family:var(--mono);font-size:26px;font-weight:700;}
.kpi-label{font-size:11.5px;color:var(--text-soft);margin-top:2px;}

.ac-btn{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:12.5px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;cursor:pointer;background:#fff;}
.ac-btn.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
.ac-dot{width:8px;height:8px;border-radius:50%;}

/* modal */
.modal-overlay{position:absolute;inset:0;background:rgba(11,18,32,.42);display:none;align-items:center;justify-content:center;z-index:30;}
.modal-overlay.show{display:flex;}
.modal{width:420px;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden;}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-head b{font-size:13.5px;}
.modal-close{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;color:var(--text-soft);}
.modal-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:5px;}
.field input, .field select{width:100%;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:12.5px;font-family:var(--sans);}
.field input.disabled{background:#F3F4F6;color:var(--text-faint);}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.helper{font-size:11px;color:var(--text-faint);}
.warn-box{background:var(--danger-bg);color:var(--danger);border-radius:7px;padding:8px 10px;font-size:11.5px;font-weight:600;}
</style>
</head>
<body>

<div class="chrome">
  <div class="file-name"><span class="dot"></span> MRO_UIUX_와이어프레임_기능명세 — v2 목업</div>
  <div class="hint">7개 프레임 · Potato_123</div>
  <div class="modeswitch">
    <button id="btn-canvas" class="active" onclick="setMode('canvas')">캔버스 보기</button>
    <button id="btn-focus" onclick="setMode('focus')">프레임 보기</button>
  </div>
</div>

<button class="back-btn" id="backBtn" onclick="setMode('canvas')" style="display:none;">&larr; 캔버스로</button>

<!-- ============ CANVAS (all 7 frames zoomed out) ============ -->
<div class="board" id="board"></div>

<!-- ============ FOCUS (single frame full size) ============ -->
<div class="stage" id="stage">
  <div class="frame-focus-wrap">
    <div class="frame-focus-tag" id="focusTag">01 · 메인 대시보드 <small>1440 × 900</small></div>
    <div class="app" id="focusApp"></div>
  </div>
</div>

<script>
/* ---------------- SAMPLE DATA (repo/spec 기반) ---------------- */
const parts = [
 {pn:'WK724-3', name:'Fuel Filter', cat:'기체', qty:2, safety:3, loc:'무안', cycle:'100H'},
 {pn:'LN94-40060', name:'Split Pin', cat:'기체', qty:10, safety:5, loc:'청주', cycle:'100H'},
 {pn:'DIN985-M6-A2', name:'Nut', cat:'기타', qty:30, safety:10, loc:'청주', cycle:'200H'},
 {pn:'RU-1620', name:'Air Filter', cat:'엔진', qty:6, safety:4, loc:'무안', cycle:'500H'},
 {pn:'E4A-52-300-KIT', name:"Eng' Oil Filter", cat:'엔진', qty:5, safety:8, loc:'청주', cycle:'100H'},
 {pn:'MSB085', name:'MSB-E4-043 Kit', cat:'기타', qty:1, safety:1, loc:'무안', cycle:'MSB'},
 {pn:'HELIX-5W40', name:"Shell HELIX Ultra Eng' Oil", cat:'엔진', qty:3, safety:3, loc:'청주', cycle:'100H'},
 {pn:'E4A-41-300-803', name:'Ear Clamp', cat:'기체', qty:6, safety:6, loc:'무안', cycle:'200H'},
 {pn:'SPIRAX-S6', name:'Gear Box Oil', cat:'엔진', qty:4, safety:2, loc:'청주', cycle:'500H'},
 {pn:'GOV-2400', name:'Governor Assy', cat:'엔진', qty:2, safety:2, loc:'무안', cycle:'2400H'},
 {pn:'PROP-2600', name:'Propeller Blade Kit', cat:'기타', qty:1, safety:2, loc:'청주', cycle:'2600H'},
 {pn:'BRK-FLUID', name:'Brake Fluid', cat:'기체', qty:12, safety:6, loc:'무안', cycle:'500H'},
];
function statusOf(p){ const r=p.qty/p.safety; if(r<=1) return 'danger'; if(r<=1.5) return 'warn'; return 'ok'; }
function statusBadge(p){
  const s=statusOf(p);
  if(s==='danger') return '<span class="badge badge-danger">● 부족</span>';
  if(s==='warn') return '<span class="badge badge-warn">● 경고</span>';
  return '<span class="badge badge-ok">● 정상</span>';
}
const aircraft = [
 {reg:'HL1179', model:'DA-40NG', hours:5237.7, next:'항공기 100HRS', engNext:"ENG' 100HRS", remain:-0.2, engRemain:47, status:'danger', serial:'40.NG471', year:2021, loc:'무안'},
 {reg:'HL1176', model:'DA-40NG', hours:6011.4, next:'항공기 200HRS', engNext:"ENG' 300HRS", remain:38, engRemain:112, status:'warn', serial:'40.NG221', year:2019, loc:'청주'},
 {reg:'HL1177', model:'DA-40NG', hours:4120.9, next:'항공기 100HRS', engNext:"ENG' 100HRS", remain:79, engRemain:653, status:'ok', serial:'40.NG233', year:2020, loc:'청주'},
 {reg:'HL1178', model:'DA-40NG', hours:3980.2, next:'항공기 500HRS', engNext:"ENG' 200HRS", remain:19, engRemain:8, status:'danger', serial:'40.NG240', year:2020, loc:'무안'},
 {reg:'HL1252', model:'DA-40NG', hours:2214.5, next:'항공기 100HRS', engNext:"ENG' 100HRS", remain:145, engRemain:288, status:'ok', serial:'40.NG512', year:2023, loc:'청주'},
 {reg:'HL1295', model:'DA-40NG', hours:988.3, next:'항공기 100HRS', engNext:"ENG' 100HRS", remain:12, engRemain:412, status:'warn', serial:'40.NG601', year:2024, loc:'무안'},
 {reg:'HL2046', model:'DA-42NG', hours:2059.4, next:'항공기 100HRS', engNext:"ENG' 100HRS", remain:22, engRemain:653, status:'warn', serial:'42.NG046', year:2022, loc:'청주'},
];
let selectedAC = aircraft[0];

const frames = [
 {id:'dash', tag:'01 · 메인 대시보드'},
 {id:'parts', tag:'02 · 부품 관리'},
 {id:'io', tag:'03 · 입출고 관리'},
 {id:'safety', tag:'04 · 안전재고 관리'},
 {id:'ac', tag:'05 · 기체 관리'},
 {id:'hist', tag:'06 · 정비 이력'},
 {id:'status', tag:'07 · 주기정비 현황 (조회 전용)'},
 {id:'proc', tag:'08 · 발주/구매관리', proposed:true},
];

/* ---------------- SHELL BUILDER ---------------- */
function sidebar(activeId){
  const groups = [
    {label:null, items:[{id:'dash', label:'메인 대시보드'}]},
    {label:'재고관리', items:[{id:'parts', label:'부품 관리'},{id:'io', label:'입출고 관리'},{id:'safety', label:'안전재고 관리'},{id:'proc', label:'발주 관리 (제안)'}]},
    {label:'항공기관리', items:[{id:'ac', label:'기체 관리'},{id:'hist', label:'정비 이력'},{id:'status', label:'주기정비 현황'}]},
  ];
  let html = `<div class="app-sidebar"><div class="brand"><span class="plane">&#9992;</span> MRO System</div>`;
  groups.forEach(g=>{
    if(g.label) html += `<div class="nav-group-label">${g.label}</div>`;
    g.items.forEach(it=>{
      html += `<div class="nav-sub ${it.id===activeId?'selected':''}" onclick="gotoFrame('${it.id}')">${it.label}</div>`;
    });
  });
  html += `</div>`;
  return html;
}
function header(crumb){
  return `<div class="app-header">
    <div class="crumb">메인화면 <span>/ 메뉴 &gt; ${crumb}</span></div>
    <div class="icon-btn" title="새로고침">&#8635;</div>
    <div class="icon-btn" title="홈">&#8962;</div>
    <div class="icon-btn" title="사이드바">&#9776;</div>
  </div>`;
}
function shell(activeId, crumb, bodyHtml, modalHtml){
  return `<div style="display:flex;width:100%;position:relative;">
    ${sidebar(activeId)}
    <div class="app-main">${header(crumb)}<div class="app-body">${bodyHtml}</div></div>
    ${modalHtml||''}
  </div>`;
}

/* ---------------- PAGE 1: 메인 대시보드 ---------------- */
function pageDash(){
  const rows = parts.map(p=>`<tr>
    <td><span class="chk"></span></td>
    <td class="mono">${p.pn}</td><td>${p.name}</td>
    <td class="mono">${p.qty}</td><td class="mono">${p.safety}</td><td>${p.loc}</td><td>${p.cycle}</td>
  </tr>`).join('');
  const acList = aircraft.map(a=>`<div class="ac-btn ${a.reg===selectedAC.reg?'sel':''}">
    <span>${a.reg}</span><span class="ac-dot" style="background:${dotColor(a.status)}"></span></div>`).join('');
  const shortage = parts.filter(p=>statusOf(p)!=='ok').map(p=>`<tr>
    <td class="mono">${p.pn}</td><td>${p.name}</td><td class="mono">${p.qty}</td><td>${p.loc}</td></tr>`).join('');

  const body = `
    <div class="page-title">메인 대시보드</div>
    <div class="page-sub">기체별 주기정비 현황 + 재고 통합 뷰</div>
    <div class="grid-2">
      <div class="card">
        <div class="toolbar" style="padding:14px 16px 0;">
          <select class="chip-select"><option>전체 ▾</option><option>기체</option><option>엔진</option><option>기타</option></select>
          <input class="search-box" placeholder="부품번호 또는 부품명칭 검색">
        </div>
        <div style="padding:14px 16px;">
        <table><thead><tr>
          <th></th><th>부품번호<span class="arrows">▲▼</span></th><th>부품명칭</th><th>재고수량</th><th>안전재고</th><th>위치</th><th>주기</th>
        </tr></thead><tbody>${rows}</tbody></table>
        </div>
      </div>
      <div>
        <div class="card" style="margin-bottom:14px;">
          <div class="panel-title">항공기 선택</div>
          <div class="panel-body">${acList}</div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center;">
            <span>${selectedAC.reg} · ${selectedAC.model}</span>
            <span style="display:flex;gap:2px;background:#F0F2F5;border-radius:6px;padding:2px;">
              <span onclick="setGaugeTab('ac')" class="mono" style="font-size:10.5px;padding:3px 8px;border-radius:5px;cursor:pointer;${gaugeTab==='ac'?'background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08);':'color:var(--text-faint);'}">기체</span>
              <span onclick="setGaugeTab('eng')" class="mono" style="font-size:10.5px;padding:3px 8px;border-radius:5px;cursor:pointer;${gaugeTab==='eng'?'background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08);':'color:var(--text-faint);'}">엔진</span>
            </span>
          </div>
          <div class="panel-body">
            <div style="font-size:11.5px;color:var(--text-soft);margin-bottom:8px;">누적 비행시간 <b class="mono" style="color:var(--text);font-size:13px;">${selectedAC.hours}h</b></div>
            <div class="gauge-wrap">
              <div style="display:flex;justify-content:space-between;font-size:11.5px;"><span>${gaugeTab==='ac'?selectedAC.next:selectedAC.engNext}</span><b class="mono">${gaugeTab==='ac'?selectedAC.remain:selectedAC.engRemain}h</b></div>

        <table><thead><tr><th>등록번호</th><th>누적시간</th><th>정비종류</th><th>담당자</th><th>날짜</th></tr></thead><tbody>${irreg}</tbody></table>
      </div>
      <div class="card"><div class="panel-title">교체 부품 목록</div>

        <table><thead><tr><th>P/N</th><th>명칭</th><th>수량</th></tr></thead>
        <tbody>
          <tr><td class="mono">WK724-3</td><td>Fuel Filter</td><td class="mono">1</td></tr>
          <tr><td class="mono">E4A-52-300</td><td>Oil Filter</td><td class="mono">1</td></tr>
        </tbody></table>
        </div>

  const modal = `<div class="modal-overlay" id="m-histNew"><div class="modal">
    <div class="modal-head"><b>정비 이력 등록</b><button class="modal-close" onclick="closeModal('histNew')">✕</button></div>
    <div class="modal-body">
      <div class="field-row"><div class="field"><label>기종</label><select><option>DA-40NG</option><option>DA-42NG</option></select></div>
      <div class="field"><label>기체 등록번호</label><select><option>HL1179</option></select></div></div>
      <div class="field-row"><div class="field"><label>정비 종류</label><input placeholder="항공기 100 HRS"></div>
      <div class="field"><label>주기</label><select><option>100H</option></select></div></div>
      <div class="field-row"><div class="field"><label>날짜</label><input placeholder="📅"></div>
      <div class="field"><label>담당 정비사</label><input placeholder="mech_mua_01"></div></div>
      <div class="field"><label>교체부품 (BOM 자동 표기)</label>
        <div class="helper" style="border:1px solid var(--border);border-radius:7px;padding:8px 10px;display:flex;justify-content:space-between;">
          WK724-3 · Fuel Filter <span>수량 1 [-][+]</span></div>

    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal('histNew')">닫기</button><button class="btn btn-primary">등록</button></div>

  return shell('hist','항공기관리 &gt; 정비이력', body, modal);
}

/* ---------------- PAGE 7: 주기정비 현황 (조회전용) ---------------- */
function pageStatus(){

  const mk = (label)=>`<div class="card"><div class="panel-title">${label}</div>

    <tbody>
      <tr><td class="mono">WK724-3</td><td>Fuel Filter</td><td class="mono">2</td><td class="mono">3</td><td class="mono">100H</td></tr>
      <tr><td class="mono">RU-1620</td><td>Air Filter</td><td class="mono">6</td><td class="mono">4</td><td class="mono">500H</td></tr>

  const shortage = parts.filter(p=>statusOf(p)!=='ok').slice(0,4).map(p=>`<tr>

  const body = `

    <div style="display:grid;grid-template-columns:220px 1fr;gap:14px;">
      <div>
        <div class="card" style="margin-bottom:14px;"><div class="panel-title">기체 선택</div>
          <div class="panel-body">${acBtns}
            <div class="helper" style="margin-top:12px;">${selectedAC.reg} · ${selectedAC.model}</div>
            <div style="font-size:12.5px;margin-top:4px;">누적 <b class="mono">${selectedAC.hours}h</b></div>
            <div style="font-size:12.5px;">잔여 <b class="mono">${selectedAC.remain}h</b></div>
          </div>
        </div>
        <div class="card"><div class="panel-title">재고 부족 부품</div>
          <table><thead><tr><th>P/N</th><th>명칭</th><th>재고</th><th>안전재고</th></tr></thead><tbody>${shortage}</tbody></table>
        </div>
      </div>
      <div>
        <div class="toolbar">
          <select class="chip-select"><option>전체 ▾</option></select>
          <select class="chip-select"><option>DA-40NG</option><option>DA-42NG</option></select>
          <input class="search-box" placeholder="부품번호 · 명칭 검색">
        </div>
        <div class="grid-3">${mk('기체 주기 정비')}${mk('엔진 주기 정비')}${mk('프로펠러')}</div>
        <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;">
          ${mk('TRP')}
          <div class="card"><div class="panel-title">MSB 잔여 상태 (도래 여부)</div><table><tbody>${msbRows}</tbody></table></div>
        </div>
      </div>
    </div>`;
  return shell('status','항공기관리 &gt; 주기정비현황', body);
}

/* ---------------- RENDER / NAV ---------------- */
const pageFns = {dash:pageDash, parts:pageParts, io:pageIO, safety:pageSafety, ac:pageAircraft, hist:pageHistory, status:pageStatus, proc:pageProcurement};

function buildBoard(){
  const board = document.getElementById('board');
  board.innerHTML = frames.map(f=>`
    <div class="frame-wrap">
      <div class="frame-tag" style="${f.proposed?'background:#F5A524;':''}">${f.tag}${f.proposed?' <small>제안</small>':''}</div>
      <div class="frame-thumb" style="${f.proposed?'border:1.5px dashed #F5A524;':''}" onclick="openFocus('${f.id}')">
        <div class="thumb-scale">${pageFns[f.id]()}</div>
      </div>
    </div>`).join('');
}
function setMode(mode){
  currentMode = mode;
  document.getElementById('board').style.display = mode==='canvas' ? 'grid' : 'none';
  document.getElementById('stage').classList.toggle('active', mode==='focus');
  document.getElementById('btn-canvas').classList.toggle('active', mode==='canvas');
  document.getElementById('btn-focus').classList.toggle('active', mode==='focus');
  document.getElementById('backBtn').style.display = mode==='focus' ? 'flex' : 'none';
}
function openFocus(id){
  currentFrame = id;
  const f = frames.find(x=>x.id===id);
  document.getElementById('focusTag').innerHTML = f.tag + (f.proposed?' <small>제안 · 원본 스펙에 없음</small>':' <small>1440 × 900</small>');
  document.getElementById('focusTag').style.background = f.proposed ? '#F5A524' : '';
  document.getElementById('focusApp').innerHTML = pageFns[id]();
  setMode('focus');
}
function gotoFrame(id){ openFocus(id); }
function openModal(name){ const m=document.getElementById('m-'+name); if(m) m.classList.add('show'); }
function closeModal(name){ const m=document.getElementById('m-'+name); if(m) m.classList.remove('show'); }

buildBoard();
</script>
